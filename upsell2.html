<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Última Chance!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #101828;
            --muted: #667085;
            --green: #12b76a;
            --green-dark: #039855;
            --green-soft: #ecfdf3;
            --blue: #2563eb;
            --red: #d92d20;
            --red-bright: #e30613;
            --border: #eaecf0;
        }

        html { background: var(--bg); }

        body {
            font-family: Arial, Helvetica, sans-serif, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(18,183,106,.12), transparent 32%),
                linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 12px 30px;
        }

        /* =========================================
           BARRA VERMELHA DE AVISO (topo)
           ========================================= */
        .warning-bar {
            width: 100vw;
            background: var(--red-bright);
            color: #fff;
            text-align: center;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: .3px;
            text-transform: uppercase;
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
            box-shadow: 0 2px 8px rgba(227,6,19,.25);
            animation: slideDown .4s ease;
        }

        .warning-bar span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card);
            border-radius: 24px;
            padding: 32px 22px 26px;
            box-shadow:
                0 2px 4px rgba(16,24,40,.03),
                0 14px 45px rgba(16,24,40,.09);
            border: 1px solid rgba(234,236,240,.9);
            animation: fadeUp .55s cubic-bezier(.16,1,.3,1);
            position: relative;
            margin-top: 22px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           HEADLINE PRINCIPAL
           ========================================= */
        h1 {
            font-size: 26px;
            line-height: 1.25;
            font-weight: 900;
            text-align: center;
            color: #101828;
            margin-bottom: 14px;
            letter-spacing: -.5px;
        }

        h1 .approved {
            color: var(--green-dark);
            font-weight: 950;
        }

        /* =========================================
           SUBTÍTULO (melhorado)
           ========================================= */
        .subtitle {
            text-align: center;
            color: #475467;
            font-size: 16px;
            line-height: 1.55;
            margin: 0 auto 22px;
            max-width: 430px;
            font-weight: 500;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px dashed #d0d5dd;
            border-radius: 14px;
            position: relative;
        }

        .subtitle strong {
            color: red;
            font-weight: 900;
        }

        .player-wrapper {
            background: #050505;
            border-radius: 17px;
            overflow: hidden;
            margin-bottom: 17px;
            aspect-ratio: 3/3.5;
            position: relative;
            max-height: 70vh;
            box-shadow:
                0 0 0 1px rgba(0,0,0,.08),
                0 12px 30px rgba(16,24,40,.16);
        }

        .player-wrapper vturb-smartplayer {
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn-primary {
            display: block;
            width: 100%;
            min-height: 58px;
            padding: 16px 18px;
            background: linear-gradient(180deg, #03ad60 0%, var(--green) 100%);
            color: #fff;
            border: 0;
            border-radius: 15px;
            font-size: 17px;
            line-height: 1.2;
            font-weight: 900;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
            box-shadow:
                0 7px 18px rgba(18,183,106,.22),
                inset 0 1px 0 rgba(255,255,255,.22);
            letter-spacing: .05px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 55%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
            transform: skewX(-20deg);
            transition: left .55s ease;
        }

        .btn-primary:hover::before { left: 140%; }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 25px rgba(18,183,106,.28),
                inset 0 1px 0 rgba(255,255,255,.22);
            filter: brightness(1.02);
        }

        .btn-primary:active { transform: translateY(1px) scale(.99); }

        /* =========================================
           LINK "NÃO, OBRIGADO" (VERMELHO)
           ========================================= */
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 13px 10px 7px;
            background: transparent;
            color: var(--red-bright);
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: color .2s ease, opacity .2s ease;
            margin-top: 8px;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-align: center;
        }

        .btn-secondary:hover {
            color: #b00510;
            opacity: .9;
        }

        @media (max-width: 520px) {
            body { padding: 0 8px 22px; }

            .warning-bar {
                font-size: 12px;
                padding: 12px 12px;
            }

            .container {
                padding: 24px 15px 21px;
                border-radius: 21px;
                margin-top: 16px;
            }

            h1 { font-size: 21px; }

            .subtitle {
                font-size: 14px;
                padding: 12px 13px;
                margin-bottom: 16px;
            }

            .player-wrapper {
                border-radius: 14px;
                margin-bottom: 14px;
            }

            .btn-primary {
                min-height: 55px;
                font-size: 13px;
                border-radius: 14px;
            }

            .btn-secondary {
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            .warning-bar {
                font-size: 11px;
                padding: 10px 8px;
            }

            .container {
                padding-left: 12px;
                padding-right: 12px;
            }

            h1 { font-size: 19px; }

            .btn-primary {
                font-size: 14px;
                padding-left: 12px;
                padding-right: 12px;
            }
        }
    </style>
</head>
