<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Oferta Relâmpago</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #101828;
            --muted: #667085;
            --green: #12b76a;
            --green-dark: #039855;
            --green-bright: #16a34a;
            --green-soft: #ecfdf3;
            --blue: #2563eb;
            --red: #d92d20;
            --red-bright: #e30613;
            --border: #eaecf0;
        }

        html { background: var(--bg); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(18,183,106,.12), transparent 32%),
                linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        /* =========================================
           SIMULAÇÃO DE POPUP (fundo escuro + blur)
           ========================================= */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(16,24,40,.58);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 999;
            padding: 0;
            animation: fadeIn .25s ease;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-card {
            background: #fff;
            max-width: 500px;
            width: 100%;
            min-height: 100vh;
            padding: 0 0 30px;
            border-radius: 0;
            text-align: center;
            box-shadow:
                0 24px 70px rgba(16,24,40,.25),
                0 2px 8px rgba(16,24,40,.08);
            animation: slideUp .35s cubic-bezier(.16,1,.3,1);
            overflow: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: scale(.96) translateY(14px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* =========================================
           BARRA VERMELHA DE AVISO (topo)
           ========================================= */
        .warning-bar {
            background: var(--red-bright);
            color: #fff;
            text-align: center;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: .3px;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(227,6,19,.25);
        }

        .warning-bar span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* =========================================
           CONTEÚDO INTERNO
           ========================================= */
        .content {
            padding: 26px 24px 20px;
        }

        /* =========================================
           IMAGEM DO PRODUTO
           ========================================= */
        .product-image {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            animation: imageIn .55s cubic-bezier(.16,1,.3,1) .1s both;
        }

        .product-image img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 18px;
            box-shadow:
                0 10px 30px rgba(16,24,40,.15),
                0 0 0 1px rgba(0,0,0,.04);
            transition: transform .35s ease, box-shadow .35s ease;
            display: block;
        }

        .product-image img:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow:
                0 16px 40px rgba(16,24,40,.22),
                0 0 0 1px rgba(0,0,0,.04);
        }

        @keyframes imageIn {
            from { opacity: 0; transform: scale(.92) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h2 {
            font-size: 28px;
            line-height: 1.15;
            font-weight: 900;
            color: var(--green-bright);
            margin-bottom: 14px;
            letter-spacing: -.5px;
            text-transform: uppercase;
        }

        .sub {
            color: #475467;
            font-size: 16px;
            line-height: 1.55;
            margin-bottom: 22px;
            font-weight: 500;
        }

        .sub strong {
            color: #101828;
            font-weight: 900;
        }

        /* =========================================
           PREÇO
           ========================================= */
        .price-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin: 18px 0 22px;
            padding: 20px 18px;
            background: #f8fafc;
            border: 1px solid #eaecf0;
            border-radius: 18px;
        }

        .price-row .old {
            font-size: 22px;
            color: #98a2b3;
            text-decoration: line-through;
            font-weight: 500;
        }

        .price-row .new {
            font-size: 42px;
            line-height: 1;
            font-weight: 950;
            color: var(--green-dark);
            letter-spacing: -1.5px;
        }

        /* =========================================
           BOTÕES
           ========================================= */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-primary {
            display: block;
            width: 100%;
            min-height: 58px;
            padding: 16px 18px;
            background: linear-gradient(180deg, #20c77b 0%, var(--green) 100%);
            color: #fff;
            border: 0;
            border-radius: 15px;
            font-size: 17px;
            line-height: 1.2;
            font-weight: 900;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
            box-shadow:
                0 7px 18px rgba(18,183,106,.22),
                inset 0 1px 0 rgba(255,255,255,.22);
            letter-spacing: .05px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 55%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
            transform: skewX(-20deg);
            transition: left .55s ease;
        }

        .btn-primary:hover::before { left: 140%; }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 25px rgba(18,183,106,.28),
                inset 0 1px 0 rgba(255,255,255,.22);
            filter: brightness(1.02);
        }

        .btn-primary:active { transform: translateY(1px) scale(.99); }

        /* =========================================
           LINK "NÃO, OBRIGADO" (VERMELHO)
           ========================================= */
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 14px 10px 7px;
            background: transparent;
            color: var(--red-bright);
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: color .2s ease, opacity .2s ease;
            margin-top: -6px;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-align: center;
        }

        .btn-secondary:hover {
            color: #b00510;
            opacity: .9;
        }

        /* =========================================
           RESPONSIVO
           ========================================= */
        @media (max-width: 520px) {
            .warning-bar {
                font-size: 12px;
                padding: 12px 12px;
            }

            .content {
                padding: 22px 16px 18px;
            }

            .product-image {
                margin-bottom: 16px;
            }

            .product-image img {
                max-width: 240px;
                border-radius: 16px;
            }

            h2 { font-size: 24px; }

            .sub {
                font-size: 15px;
                margin-bottom: 18px;
            }

            .price-row {
                gap: 14px;
                padding: 16px 14px;
                margin: 14px 0 18px;
            }

            .price-row .old { font-size: 19px; }
            .price-row .new { font-size: 36px; }

            .btn-primary {
                min-height: 55px;
                font-size: 15px;
                border-radius: 14px;
            }

            .btn-secondary {
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            .warning-bar {
                font-size: 11px;
                padding: 10px 8px;
            }

            .content {
                padding-left: 13px;
                padding-right: 13px;
            }

            .product-image img {
                max-width: 210px;
                border-radius: 14px;
            }

            h2 { font-size: 21px; }

            .sub { font-size: 14px; }

            .price-row {
                gap: 10px;
                padding-left: 12px;
                padding-right: 12px;
            }

            .price-row .old { font-size: 17px; }
            .price-row .new { font-size: 32px; }

            .btn-primary {
                font-size: 14px;
                padding-left: 12px;
                padding-right: 12px;
            }
        }
    </style>
</head>
<body>

<!-- "Popup" simulado como página inteira -->
<div class="overlay">
    <div class="popup-card">

        <!-- BARRA VERMELHA DE AVISO -->
        <div class="warning-bar">
            <span>⚠️ ESPERA! ÚLTIMA CHANCE COM DESCONTO</span>
        </div>

        <div class="content">

            <!-- IMAGEM DO PRODUTO -->
            <div class="product-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4tzu4RG5ORvUKCboenowMvGHAs9ozy9p4-m7qdFfqnjjzUmxasT3RluNp&s=10" alt="Acelerador de Resultados">
            </div>

            <h2>VOCÊ Ganhou um desconto!</h2>

            <p class="sub">
                Como chegou até aqui, liberámos <strong>apenas nesta página e apenas uma vez</strong> um desconto especial para que consigas resolver o seu problema em apenas 3 dias:
            </p>

            <div class="price-row">
                <span class="old">169 MZN</span>
                <span class="new">87 MZN</span>
            </div>

            <div class="btn-group">
                <a class="btn-primary" href="#">QUERO TER RESULTADOS EM 3 DIAS</a>
                <a class="btn-secondary" href="upsell2.html">Não, obrigado</a>
            </div>
        </div>

    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
